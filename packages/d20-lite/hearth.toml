id = "d20-lite"
type = "system"
name = "d20 Lite"
version = "0.1.0"
description = "A small, generic d20 ruleset: six abilities, levels, HP, AC and weapons."
authors = ["Hearth contributors"]
license = "CC0-1.0"
# Kinds of rest (resources below say what each one restores).
rests = ["short", "long"]

[server]
script = "rules.rhai"

[combat]
# @initiative is the DEX modifier, computed in rules.rhai.
initiative = "1d20 + @initiative"

[client]
styles = ["d20.css"]
scripts = ["d20.js"]

[actor_types.character]
label = "Character"
sheet = "sheets/character.html"
template = { level = 1, ac = 10, speed = 30, hp = { value = 10, max = 10 }, abilities = { str = 10, dex = 10, con = 10, int = 10, wis = 10, cha = 10 }, notes = "" }

[actor_types.npc]
label = "NPC"
sheet = "sheets/character.html"
template = { level = 1, ac = 12, speed = 30, hp = { value = 7, max = 7 }, abilities = { str = 10, dex = 10, con = 10, int = 10, wis = 10, cha = 10 }, notes = "" }

[item_types.weapon]
label = "Weapon"
template = { ability = "str", damage = "1d6", proficient = true }

[item_types.feature]
label = "Feature"
template = { description = "" }

# ---------------------------------------------------------------- rules
# Calculated values, actions and conditions. The server works these out; see
# docs/rules.md. rules.rhai only tags natural 20s and 1s.

[tables.proficiency]   # level → proficiency bonus (highest level not above yours)
1 = 2
5 = 3
9 = 4
13 = 5
17 = 6

[actor_types.character.formulas]
"abilities.*.mod" = "floor((@this - 10) / 2)"
proficiency = "table('proficiency', @level)"
initiative = "@abilities.dex.mod"

[actor_types.character.resources.hp]
label = "Hit points"
reset = { long = "max" }
bar = true

[actor_types.npc.formulas]
"abilities.*.mod" = "floor((@this - 10) / 2)"
proficiency = "table('proficiency', @level)"
initiative = "@abilities.dex.mod"

[actor_types.npc.resources.hp]
label = "Hit points"
reset = { long = "max" }
bar = true

[item_types.weapon.formulas]
attack = "@abilities[@item.ability].mod + (@item.proficient ? @proficiency : 0)"
damage_mod = "@abilities[@item.ability].mod"

[[item_types.weapon.actions]]
id = "attack"
label = "Attack"
kind = "attack"
roll = "1d20 + @item.attack"
then = ["damage"]

[[item_types.weapon.actions]]
id = "damage"
label = "Damage"
kind = "damage"
roll = "@item.damage + @item.damage_mod"

[[conditions]]
id = "poisoned"
name = "Poisoned"
changes = [
  { path = "mods.attack.disadvantage", mode = "set", value = "1" },
  { path = "mods.check.disadvantage", mode = "set", value = "1" },
]

[[conditions]]
id = "inspired"
name = "Inspired"
changes = [{ path = "mods.attack.advantage", mode = "set", value = "1" }]

[[conditions]]
id = "slowed"
name = "Slowed"
changes = [{ path = "speed", mode = "multiply", value = "0.5" }]

# ---------------------------------------------------------------- content packs

[[packs]]
id = "weapons"
label = "Weapons"
kind = "item"
path = "packs/weapons.json"
public = true

[[packs]]
id = "bestiary"
label = "Bestiary"
kind = "actor"
path = "packs/bestiary.json"

[[packs]]
id = "rules"
label = "Rules reference"
kind = "journal"
path = "packs/rules.json"
public = true
