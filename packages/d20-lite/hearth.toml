id = "d20-lite"
type = "system"
name = "d20 Lite"
version = "0.1.0"
description = "A small, generic d20 ruleset: six abilities, levels, HP, AC and weapons."
authors = ["Hearth contributors"]
license = "CC0-1.0"

[server]
script = "rules.rhai"

[client]
styles = ["d20.css"]
scripts = ["d20.js"]

[actor_types.character]
label = "Character"
sheet = "sheets/character.html"
template = { level = 1, ac = 10, speed = 30, hp = { value = 10, max = 10 }, abilities = { str = 10, dex = 10, con = 10, int = 10, wis = 10, cha = 10 }, notes = "" }

[actor_types.npc]
label = "NPC"
sheet = "sheets/character.html"
template = { level = 1, ac = 12, speed = 30, hp = { value = 7, max = 7 }, abilities = { str = 10, dex = 10, con = 10, int = 10, wis = 10, cha = 10 }, notes = "" }

[item_types.weapon]
label = "Weapon"
template = { ability = "str", damage = "1d6", proficient = true }

[item_types.feature]
label = "Feature"
template = { description = "" }
